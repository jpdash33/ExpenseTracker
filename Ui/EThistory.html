<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/history.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/png" href="favicon.png">


    <title>Expense Tracker/Expense History</title>
</head>

<body>

    <nav class="navbar" id="nav">
        <div class="logo"> Expense Tracker </div>

        <div class="nav-links">
            <a href="EThome.html">Home</a>
            <a href="EThistory.html" class="active">Expense History</a>
            <a href="ETdashboard.html">Dashboard</a>
            <a href="#" id="out">Log out</a>

        </div>
    </nav>



    <div class="history-container">
        <div class="history-summary">

            <div class="summary-card">
                <span class="summary-label">Total Expense</span>
                <span class="summary-value" id="total-expense">₹0.00</span>
            </div>

            <div class="summary-card">
                <span class="summary-label">This Month</span>
                <span class="summary-value" id="month-expense">₹0.00</span>
            </div>

        </div>


        <div class="search-section">
            <input type="text" id="search-expense" placeholder="Search expense...">
            <button id="search-btn"> Search </button>
        </div>

        <div class="expense-table-container">
            <table class="expense-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Date & Time</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="expense-list">
                    <tr id="no-expense-row">
                        <td colspan="5">
                            <div class="empty-state">
                                <div class="empty-icon">💸</div>
                                <h3>No Transactions Yet</h3>
                                <p>Your expenses will appear here once you add a transaction.</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>







    <script src="/eel.js"></script>
    <script src="EThistory.js"></script>
    <script src="ETlogout.js"></script>
</body>

</html>
