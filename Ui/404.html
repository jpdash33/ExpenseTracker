
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Expense Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --navy: #192e50;
      --muted: #627796;
      --green: #119c78;
      --mint: #e7f7f1;
      --blue: #eaf2ff;
    }

    body {
      min-height: 100vh;
      font-family: "Nunito", sans-serif;
      color: var(--navy);
      background:
        radial-gradient(ellipse at 50% 43%, #f0f6ff 0%, transparent 42%),
        #fbfdff;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .navbar {
      height: 88px;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      background: rgba(255, 255, 255, .86);
      border-bottom: 1px solid #eef3fa;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      color: var(--green);
      font-size: 29px;
    }

    .brand-name {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -.7px;
    }

    .brand-name span {
      color: var(--green);
    }

    .tagline {
      margin-top: -2px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .5px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    nav a {
      padding: 12px 0;
      color: #536987;
      font-size: 15px;
      font-weight: 700;
      transition: color .2s;
    }

    nav a:hover,
    nav a.active {
      color: #2478f5;
    }

    .page {
      min-height: calc(100vh - 88px);
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 38px 20px 32px;
      text-align: center;
    }

    .content {
      width: 100%;
      max-width: 760px;
      animation: appear .8s ease both;
    }

    .illustration {
      height: 350px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
    }

    .blob {
      position: absolute;
      width: 490px;
      height: 260px;
      border-radius: 46% 54% 58% 42%;
      background: linear-gradient(135deg, #edf4ff, #f7faff);
      transform: rotate(-8deg);
      z-index: -1;
    }

    .number {
      position: absolute;
      top: 60px;
      font-size: clamp(170px, 25vw, 255px);
      line-height: 1;
      letter-spacing: -12px;
      font-weight: 900;
      color: #203657;
    }

    .number .left {
      margin-right: 112px;
    }

    .number .right {
      margin-left: 112px;
    }

    .wallet {
      position: absolute;
      top: 110px;
      left: 50%;
      width: 190px;
      height: 145px;
      transform: translateX(-50%) rotate(-8deg);
      border: 7px solid #203451;
      border-radius: 25px;
      background: linear-gradient(145deg, #536987, #263b59);
      box-shadow: 0 13px 0 #d6e4f4, 0 24px 35px #233d5c20;
      z-index: 2;
      animation: wobble 4s ease-in-out infinite;
    }

    .wallet::before {
      content: "";
      position: absolute;
      top: 9px;
      left: 12px;
      right: 12px;
      height: 9px;
      border-top: 3px dashed #91a3ba66;
      border-radius: 50%;
    }

    .money {
      position: absolute;
      top: -41px;
      left: 40px;
      width: 83px;
      height: 43px;
      border: 5px solid #399d88;
      border-radius: 7px;
      background: #76d2b5;
      transform: rotate(-17deg);
      z-index: -1;
    }

    .money::after {
      content: "$";
      color: #24896f;
      font-size: 28px;
      font-weight: 900;
    }

    .face {
      position: absolute;
      top: 45px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 31px;
    }

    .eye {
      width: 23px;
      height: 28px;
      border-radius: 50%;
      background: white;
      position: relative;
    }

    .eye::after {
      content: "";
      position: absolute;
      top: 5px;
      left: 8px;
      width: 9px;
      height: 12px;
      background: #203451;
      border-radius: 50%;
    }

    .mouth {
      position: absolute;
      left: 50%;
      top: 87px;
      width: 25px;
      height: 14px;
      border-top: 5px solid #192b46;
      border-radius: 50%;
      transform: translateX(-50%);
    }

    .clasp {
      position: absolute;
      right: -14px;
      top: 53px;
      width: 43px;
      height: 34px;
      border: 5px solid #203451;
      border-radius: 10px;
      background: #465e7c;
    }

    .clasp::after {
      content: "";
      position: absolute;
      top: 7px;
      left: 10px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffc74e;
    }

    .question {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) rotate(8deg);
      font-size: 74px;
      line-height: 1;
      font-weight: 900;
      color: #243b5c;
      animation: float 3s ease-in-out infinite;
    }

    .coin {
      position: absolute;
      width: 48px;
      height: 17px;
      border-radius: 50%;
      background: #ffca39;
      border-bottom: 5px solid #e9a719;
      box-shadow: 0 4px 0 #f5b525;
    }

    .coin::after {
      content: "$";
      position: absolute;
      top: -6px;
      left: 18px;
      color: #fff4b9;
      font-size: 14px;
      font-weight: 900;
    }

    .coin.one { bottom: 35px; left: 17%; }
    .coin.two { bottom: 60px; right: 22%; transform: scale(1.1); }
    .coin.three { bottom: 39px; right: 31%; transform: scale(.7); }

    .receipt {
      position: absolute;
      bottom: 4px;
      left: 42%;
      width: 80px;
      height: 46px;
      padding: 10px 8px;
      background: #dceefa;
      transform: rotate(13deg);
      opacity: .9;
    }

    .receipt span {
      display: block;
      height: 3px;
      margin-bottom: 5px;
      background: #a6c9df;
    }

    h1 {
      font-size: clamp(29px, 4vw, 43px);
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .description {
      max-width: 640px;
      margin: 18px auto 34px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      min-height: 56px;
      padding: 0 34px;
      border-radius: 50px;
      background: linear-gradient(110deg, #13a985, #079674);
      color: white;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 10px 25px #119c782b;
      transition: transform .2s, box-shadow .2s;
    }

    .home-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px #119c7840;
    }

    .footer {
      margin-top: 48px;
      color: #8ba0bf;
      font-size: 14px;
      font-style: italic;
      font-weight: 700;
      letter-spacing: .5px;
    }

    .footer::before,
    .footer::after {
      content: "";
      display: inline-block;
      vertical-align: middle;
      width: 32px;
      height: 1px;
      margin: 0 15px;
      background: #c0d0e4;
    }

    .decoration {
      position: absolute;
      bottom: -75px;
      width: 260px;
      height: 230px;
      border-radius: 48% 52% 0 0;
      background: #e7f7f2;
      opacity: .75;
      z-index: -1;
    }

    .decoration.left {
      left: -90px;
      transform: rotate(-25deg);
    }

    .decoration.right {
      right: -100px;
      transform: rotate(25deg);
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { margin-top: 0; }
      50% { margin-top: -10px; }
    }

    @keyframes wobble {
      0%, 100% { rotate: -2deg; }
      50% { rotate: 2deg; }
    }

    @media (max-width: 700px) {
      .navbar {
        height: auto;
        min-height: 78px;
        padding: 15px 5%;
        flex-wrap: wrap;
      }

      .brand-name { font-size: 21px; }
      nav { width: 100%; justify-content: space-between; gap: 10px; }
      nav a { font-size: 13px; }

      .page {
        min-height: calc(100vh - 125px);
        padding: 25px 18px;
      }

      .illustration {
        height: 285px;
        transform: scale(.85);
        margin: -5px 0 0;
      }

      .blob { width: 330px; height: 205px; }
      .number { top: 70px; font-size: 170px; }
      .number .left { margin-right: 75px; }
      .number .right { margin-left: 75px; }

      .wallet {
        top: 108px;
        width: 150px;
        height: 120px;
      }

      .face { top: 35px; }
      .mouth { top: 73px; }
      .clasp { top: 43px; }
      .question { top: 17px; font-size: 58px; }

      .description { font-size: 16px; margin: 15px auto 26px; }
      .footer { margin-top: 38px; font-size: 12px; }
      .footer::before, .footer::after { width: 15px; margin: 0 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <header class="navbar">
    <a class="brand" href="home.html" aria-label="Expense Tracker home">
      <div class="brand-icon">
        <i class="fa-solid fa-wallet"></i>
      </div>
      <div>
        <div class="brand-name">Expense <span>Tracker</span></div>
        <div class="tagline">Track · Save · Grow</div>
      </div>
    </a>


  </header>

  <main class="page">
    <div class="decoration left"></div>
    <div class="decoration right"></div>

    <section class="content">
      <div class="illustration" aria-label="A confused wallet surrounded by coins">
        <div class="blob"></div>

        <div class="number" aria-hidden="true">
          <span class="left">4</span><span class="right">4</span>
        </div>

        <div class="question">?</div>

        <div class="wallet">
          <div class="money"></div>
          <div class="face">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
          <div class="mouth"></div>
          <div class="clasp"></div>
        </div>

        <div class="coin one"></div>
        <div class="coin two"></div>
        <div class="coin three"></div>

        <div class="receipt">
          <span></span><span></span><span></span>
        </div>
      </div>

      <h1>Oops! Page Not Found</h1>

      <p class="description">
        It looks like the page you're looking for doesn't exist
        or may have been moved. Don't worry, your expenses are still safe! 😊
      </p>

      <a class="home-button" href="EThome.html">
        <i class="fa-solid fa-house"></i>
        Go Back Home
      </a>

      <div class="footer">
        Better Tracking &nbsp; • &nbsp; Brighter Future
      </div>
    </section>
  </main>
</body>
</html>
